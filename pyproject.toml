[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datarecoveryagent"
version = "0.1.0"
description = "Local-first, read-only disk-image triage for recovering music projects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hoodtronik"}]
dependencies = []

[project.scripts]
dra = "datarecoveryagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
